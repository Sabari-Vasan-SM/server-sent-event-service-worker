<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Visitor Counter (Offline Ready)</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 60px;
        }

        #counter {
            font-size: 3em;
            margin: 20px 0;
        }

        #offline-banner {
            display: none;
            background: #ff9800;
            color: #fff;
            padding: 10px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }
    </style>
</head>

<body>
    <div id="offline-banner">Offline Mode: Live updates paused</div>
    <h1>Live Visitor Counter</h1>
    <div id="counter">0</div>
    <h2>Connected Users</h2>
    <ul id="user-list"></ul>

    <h2>Chat</h2>
    <div id="chat-box" style="height:150px;overflow-y:auto;border:1px solid #ccc;margin-bottom:8px;"></div>
    <form id="chat-form">
        <input id="chat-input" type="text" placeholder="Type a message..." autocomplete="off" style="width:70%;">
        <button type="submit">Send</button>
    </form>

    <h2>Counter History</h2>
    <canvas id="counter-graph" width="400" height="120" style="border:1px solid #ccc;"></canvas>

    <h2>Admin Controls</h2>
    <button id="reset-btn">Reset Counter</button>
    <button id="pause-btn">Pause</button>
    <button id="resume-btn">Resume</button>

    <script src="app.js"></script>
</body>

</html>
