<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Live Visitor Counter (Offline Ready)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        #counter {
            font-size: 3em;
            margin: 20px 0;
        }

        #offline-banner {
            display: none;
            background: #ff9800;
            color: #fff;
            padding: 10px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }
    </style>
</head>

<body>
    <div id="offline-banner">Offline Mode: Live updates paused</div>
    <h1>Live Visitor Counter</h1>
    <div id="counter">0</div>
    <script src="app.js"></script>
</body>

</html>
